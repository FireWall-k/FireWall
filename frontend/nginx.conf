server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 기본 보안 헤더. 근로자 화면을 다른 사이트가 iframe으로 감싸 속이는 것(클릭재킹)을 막는다.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
        # index.html은 캐시하지 않는다(no-cache는 "매번 서버에 확인" — ETag가 같으면 304만 받고 끝).
        # JS/CSS는 파일명에 내용 해시가 붙어 있어(재빌드하면 파일명도 바뀜) 캐시가 안전하지만,
        # index.html은 그 해시 붙은 파일명을 담고 있는 유일한 곳이다. index.html이 브라우저에
        # 캐시된 채로 남아 있으면 예전 해시의 JS를 계속 요청해 재배포 후에도 화면이 안 바뀐다
        # (강력 새로고침을 해야만 반영되던 원인).
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
