# 푸시·PR마다 세 부분(AI 서비스, 백엔드, 프론트엔드)의 테스트를 돌린다.
# 버전은 각 Dockerfile과 맞춘다(python:3.12-slim, node:20-alpine) — 배포 이미지와 같은 조건에서 검증한다.
# 외부 API(OpenAI, Google TTS)는 쓰지 않는다: AI 테스트는 임베딩을 끄고(conftest), 백엔드 테스트는
# AI 호출·TTS를 목으로 바꾼다. 그래서 비밀값 없이 돌고, 결과가 매번 같다.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 비밀값 스캔(Phase 0.5): 저장소 히스토리 전체를 gitleaks로 훑는다. 커밋에 키가 섞이면 실패한다.
  # gitleaks-action 대신 공식 릴리스 바이너리를 쓰는 이유: 조직 저장소에서는 그 액션이 유료 라이선스 키
  # (GITLEAKS_LICENSE)를 요구한다. 바이너리는 버전과 SHA-256을 아래에 고정해 바꿔치기를 막는다.
  # 로컬 커밋 전 검사는 .pre-commit-config.yaml의 같은 버전 훅이 한다.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"  # linux_x64.tar.gz
    steps:
      # 액션은 커밋 SHA로 고정한다(태그는 옮겨질 수 있다). 다른 잡의 고정은 Phase 1에서 한다.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0  # 최신 커밋만이 아니라 히스토리 전체를 본다(지웠던 키도 히스토리에 남는다)
      - name: gitleaks 설치(체크섬 검증)
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
      # --redact: 찾은 값을 로그에 찍지 않는다(공개 CI 로그로 키가 한 번 더 새지 않게).
      - name: 히스토리 전체 스캔
        run: ./gitleaks git . --config .gitleaks.toml --redact --verbose --exit-code 1

  ai_service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai_service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai_service/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # 빈 DB에 리비전 체인 전체를 적용한 뒤 models.py와 차이가 없는지 본다.
      # 모델만 고치고 리비전을 안 만들면 여기서 실패한다(운영 DB에는 컬럼이 안 생기므로).
      - name: 빈 DB에서 전체 마이그레이션 + alembic check
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/ci-migrate.db
        run: |
          python -m alembic upgrade head
          python -m alembic check
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # 근로자 화면 접근성 e2e(Phase 0.4): 실제 Chromium에서 버튼 높이 80px 이상·axe serious 위반 0을 확인한다.
  # jsdom 단위 테스트는 CSS를 계산하지 않아 "클래스는 붙어 있는데 스타일이 없는" 결함을 못 잡기 때문이다.
  # 백엔드는 띄우지 않는다 — API는 테스트가 page.route로 목킹하므로 비밀값이 필요 없다.
  frontend-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # 실패 시 원인(트레이스·스크린샷)을 내려받아 볼 수 있게 남긴다.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
