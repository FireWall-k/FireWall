name: jobcard

services:
  ai_service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: jobcard-ai
    ports:
      # 호스트 IP를 127.0.0.1로 명시해 IPv6([::1]) 쪽에는 아예 리스너가 안 생기게 한다.
      # 안 그러면 Windows+WSL2 Docker Desktop이 "localhost"의 IPv6 주소로 들어온 연결을
      # 받았다가 리셋해버려서(브라우저는 ::1을 먼저 시도) "localhost"가 안 열린다.
      # 127.0.0.1만 열어 두면 그 시도가 바로 거부되어 브라우저가 곧장 IPv4로 넘어간다.
      - "127.0.0.1:8001:8001"
    environment:
      PYTHONUNBUFFERED: "1"
      AAC_DATA_DIR: "/app/aac"
      AAC_MATCH_THRESHOLD: "0.215"
      AAC_MATCH_MIN_MARGIN: "0.018"
      # 여유 방식: absolute(s1−s2) | relative((s1−s2)/s1, AAC_MATCH_MIN_REL_MARGIN 사용)
      AAC_MATCH_MARGIN_MODE: "absolute"
      AAC_MATCH_MIN_REL_MARGIN: "0.06"
      # 직무만 다르고 라벨·frame이 같은 그림을 여유 판정에서 한 묶음으로 볼지. 복장·배경이 달라 기본 off
      AAC_MATCH_CROSS_JOB_TWINS: "off"
      # 임베딩 가산 항(data/aac/aac_embeddings.npz + 질의 임베딩). 기본 제공자는 local — 이미지에 구운
      # 무료 다국어 모델(paraphrase-multilingual-MiniLM-L12-v2, ONNX)이라 키·네트워크가 필요 없다.
      # openai로 바꾸면 text-embedding-3-large를 쓰고(키 필요), 자산 파일도 그 모델로 다시 만들어야 한다.
      # 임베딩을 쓴 검색은 위 기본 임계값 대신 제공자별 임베딩 임계값으로 판정한다(local 0.24/0.015,
      # openai 0.35/0.02 — local_aac._EMBED_DEFAULTS). 비워 두면 그 기본값, 값을 주면 그 값이 이긴다.
      # 보정값 이름은 제공자마다 다르다: local은 AAC_LOCAL_EMBED_*, openai는 AAC_EMBED_*. 예전 .env에 남은
      # OpenAI 값(AAC_EMBED_WEIGHT=0.5 등)이 로컬 모델에 붙으면 성능이 떨어지기 때문이다(기동 로그에 경고).
      # 파일이 낡았거나 모델 로딩이 실패하면 자동으로 임베딩 없이(위 임계값으로) 동작한다. 기본 off,
      # "auto"로 켠다(블라인드셋에서 오답 채택이 늘어 기본으로 켜지 않는다 — ai_service/eval/README.md).
      AAC_EMBEDDINGS: "${AAC_EMBEDDINGS:-off}"
      AAC_EMBED_PROVIDER: "${AAC_EMBED_PROVIDER:-local}"
      AAC_LOCAL_EMBED_MATCH_THRESHOLD: "${AAC_LOCAL_EMBED_MATCH_THRESHOLD:-}"
      AAC_LOCAL_EMBED_MATCH_MIN_MARGIN: "${AAC_LOCAL_EMBED_MATCH_MIN_MARGIN:-}"
      AAC_LOCAL_EMBED_WEIGHT: "${AAC_LOCAL_EMBED_WEIGHT:-}"
      AAC_LOCAL_EMBED_BASE: "${AAC_LOCAL_EMBED_BASE:-}"
      AAC_EMBED_MATCH_THRESHOLD: "${AAC_EMBED_MATCH_THRESHOLD:-}"
      AAC_EMBED_MATCH_MIN_MARGIN: "${AAC_EMBED_MATCH_MIN_MARGIN:-}"
      AAC_EMBED_WEIGHT: "${AAC_EMBED_WEIGHT:-}"
      AAC_EMBED_BASE: "${AAC_EMBED_BASE:-}"
      AAC_EMBED_TIMEOUT: "3"
      # OpenAI(LLM) — 키가 있으면 맥락적응 분해 + AI 코칭이 켜지고, 없으면 규칙 기반 폴백.
      # 키는 Docker secret 파일(./secrets/openai_api_key.txt → /run/secrets/openai_api_key)로 받는다.
      # 환경변수 값은 docker inspect·/proc/<pid>/environ에 그대로 보이기 때문이다(docs/security/secrets.md).
      OPENAI_API_KEY_FILE: "/run/secrets/openai_api_key"
      # OPENAI_API_KEY 환경변수 직접 주입은 없앴다(예전 "${OPENAI_API_KEY:-}" 줄). .env에 키가 남아 있으면 그 값이
      # 컨테이너 환경(docker inspect)에 그대로 실렸다. .env에 키가 있던 설치본은 scripts/init-secrets.sh(.ps1)가
      # 그 값을 secrets/openai_api_key.txt로 옮겨 준다(값은 출력하지 않는다). 컨테이너 밖 로컬 실행(uvicorn 직접)은
      # 여전히 환경변수 OPENAI_API_KEY를 읽는다(secret_env.py 하위호환).
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o-mini}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      LLM_TIMEOUT: "${LLM_TIMEOUT:-20}"
      # AAC 그림 GPT 재순위(ai_service/aac_rerank.py). 컨테이너 기본은 off — 키가 있으면 단계마다 유료 호출이
      # 나가므로, 봉인 시험지 3 확인 전에는 .env에서 AAC_LLM_RERANK=auto로 직접 켤 때만 돈다. 끄면 규칙만 쓴다.
      AAC_LLM_RERANK: "${AAC_LLM_RERANK:-off}"
      AAC_LLM_RERANK_POLICY: "${AAC_LLM_RERANK_POLICY:-top1}"
      AAC_LLM_RERANK_TIMEOUT: "${AAC_LLM_RERANK_TIMEOUT:-4}"
      AAC_LLM_RERANK_COOLDOWN: "${AAC_LLM_RERANK_COOLDOWN:-60}"
      AAC_LLM_RERANK_CACHE: "${AAC_LLM_RERANK_CACHE:-1024}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    secrets:
      - openai_api_key
    volumes:
      - ./data/aac:/app/aac:ro

  # 일회성 스키마 마이그레이션. backend와 같은 이미지로 `manage.py migrate`를 한 번 돌리고 끝난다.
  # 요청을 받는 backend 프로세스(lifespan)에서 돌리지 않는 이유: 인스턴스가 여럿이면 마이그레이션이
  # 겹치고, 실패하면 반쯤 바뀐 DB로 요청을 받게 된다. backend는 이 서비스가 성공해야 뜬다.
  # Alembic 도입 전 볼륨(alembic_version 없음)도 이 명령이 보정 후 baseline으로 stamp한다.
  migrate:
    # build는 backend 서비스에만 둔다. 여기에도 build를 적으면 compose가 같은 Dockerfile을 서비스마다
    # 따로 빌드해(이중 빌드) 시간이 들고, 빌드 사이에 소스가 바뀌면 migrate와 backend가 다른 코드로 돈다.
    # `docker compose up`/`build`는 컨테이너를 만들기 전에 backend의 build로 jobcard-backend를 먼저
    # 만들므로 여기서는 그 이미지를 쓰기만 한다. pull_policy: never — 레지스트리에서 같은 이름의 엉뚱한
    # 이미지를 받아 오지 않게 한다(이미지가 없으면 받지 말고 실패해서 `docker compose build`를 먼저 하게 한다).
    image: jobcard-backend
    pull_policy: never
    command: ["python", "manage.py", "migrate"]
    restart: "no"
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: "sqlite:////app/data/jobcard.db"
      JOBCARD_ENV: "${JOBCARD_ENV:-dev}"
      # 0002 리비전이 기존 근로자 접속 코드를 HMAC(JOBCARD_SECRET) 해시로 바꾼다. backend와 같은 키여야
      # 한다 — 다르면(예: 여기만 비어 개발용 기본 키로 해시) 기존 근로자 전원이 로그인하지 못한다.
      # 그래서 backend·purge와 같은 Docker secret(jobcard_secret)을 받는다. 파일이 환경변수보다 우선한다.
      JOBCARD_SECRET_FILE: "/run/secrets/jobcard_secret"
      # 하위호환(파일이 비어 있을 때만 쓴다). backend 주석 참고.
      JOBCARD_SECRET: "${JOBCARD_SECRET:-}"
      # 0004 리비전이 기존 사진·TTS URL을 소유 레코드로 옮기면서 파일을 읽고(사진은 EXIF를 지워 다시 저장) 쓴다.
      # backend와 같은 경로여야 한다 — 다르면 파일이 없는 것으로 보고 URL을 비운다.
      TTS_CACHE_DIR: "/app/data/tts"
      PHOTO_DIR: "/app/data/photos"
      # 되돌릴 때(downgrade) 옛 정적 URL을 다시 만드는 기준 주소.
      PUBLIC_BACKEND_URL: "${PUBLIC_BACKEND_URL:-http://localhost:8000}"
    secrets:
      - jobcard_secret
    volumes:
      - jobcard-data:/app/data

  # 보존기간이 지난 데이터 삭제(docs/privacy/data-map.md)를 손으로 한 번 돌릴 때 쓴다. 평소에는 뜨지 않는다(profiles).
  #   docker compose --profile maintenance run --rm purge python manage.py purge --dry-run   # 확인만
  # 매일 도는 정기 삭제는 아래 scheduler 서비스가 한다(예전처럼 호스트 crontab에 등록할 필요 없음).
  purge:
    image: jobcard-backend  # build는 backend에만(migrate 주석 참고)
    pull_policy: never
    profiles: ["maintenance"]
    command: ["python", "manage.py", "purge"]
    restart: "no"
    environment: &purge-env
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: "sqlite:////app/data/jobcard.db"
      JOBCARD_ENV: "${JOBCARD_ENV:-dev}"
      JOBCARD_SECRET_FILE: "/run/secrets/jobcard_secret"
      JOBCARD_SECRET: "${JOBCARD_SECRET:-}"  # 하위호환(backend 주석 참고)
      TTS_CACHE_DIR: "/app/data/tts"
      # 고아 사진·TTS 정리(media.gc)도 purge가 함께 한다.
      PHOTO_DIR: "/app/data/photos"
      # 수행 로그 보존(일). 기본 1년.
      PERFORMANCE_LOG_RETENTION_DAYS: "${PERFORMANCE_LOG_RETENTION_DAYS:-365}"
      # 접근 감사 로그 보존(일). 민감정보 처리 시스템의 접속기록은 2년 이상 보관(안전성 확보조치 기준 제8조).
      ACCESS_AUDIT_RETENTION_DAYS: "${ACCESS_AUDIT_RETENTION_DAYS:-730}"
      TTS_ORPHAN_GRACE_HOURS: "${TTS_ORPHAN_GRACE_HOURS:-24}"
      # 사진·TTS 공통 유예시간. 비우면 예전 TTS_ORPHAN_GRACE_HOURS 값을 그대로 쓴다.
      MEDIA_ORPHAN_GRACE_HOURS: "${MEDIA_ORPHAN_GRACE_HOURS:-${TTS_ORPHAN_GRACE_HOURS:-24}}"
      # 마지막 성공 시각 기록(maintenance.py). backend가 같은 볼륨의 같은 파일을 읽어 /health의 purge에 싣는다.
      PURGE_STATUS_FILE: "/app/data/maintenance/purge_status.json"
    secrets:
      - jobcard_secret
    volumes:
      - jobcard-data:/app/data

  # 정기 보존기간 삭제. 기본 프로필이라 `docker compose up`이면 같이 뜬다. 마지막 성공 후 PURGE_INTERVAL_HOURS
  # (기본 24)마다 purge(수행 로그·접근 감사 로그 + 고아 사진·TTS 정리)를 한 번 돌리고 성공 시각을 남긴다.
  # 왜 별도 서비스인가: 예전에는 운영자가 호스트 crontab에 직접 등록해야 해서, 잊으면 개인정보가 보존기간을 넘겨
  # 남는데 아무 데서도 드러나지 않았다. backend 안에 두지 않는 이유는 backend를 여러 개 띄우면 같은 삭제가 겹치기
  # 때문이다 — 이 서비스는 반드시 하나만 띄운다(replicas를 늘리지 않는다). 확인: `docker compose logs scheduler`,
  # 또는 backend `/health`의 purge.last_success_at·age_hours·stale.
  scheduler:
    image: jobcard-backend  # build는 backend에만(migrate 주석 참고)
    pull_policy: never
    container_name: jobcard-scheduler
    command: ["python", "manage.py", "schedule"]
    restart: unless-stopped
    environment:
      <<: *purge-env
      PURGE_INTERVAL_HOURS: "${PURGE_INTERVAL_HOURS:-24}"
      PURGE_RETRY_MINUTES: "${PURGE_RETRY_MINUTES:-60}"
    secrets:
      - jobcard_secret
    volumes:
      - jobcard-data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: jobcard-backend
    container_name: jobcard-api
    ports:
      - "127.0.0.1:8000:8000"  # 위 ai_service 주석 참고
    environment:
      PYTHONUNBUFFERED: "1"
      AI_BASE_URL: "http://ai_service:8001"
      # 자체 AAC 이미지 경로
      AAC_DATA_DIR: "/app/aac"
      # LLM(OpenAI) 분해는 10초 이상 걸릴 수 있어 넉넉히 둔다. 규칙 기반만 쓸 땐 6초로도 충분했음.
      AI_TIMEOUT: "30"
      DATABASE_URL: "sqlite:////app/data/jobcard.db"
      # --- 운영 설정 (.env에서 넣는다. 비워 두면 로컬 개발용 기본값) ---
      # prod로 두면: 약한 JOBCARD_SECRET이면 기동 실패, 데모 계정 미생성(manage.py로 사업주 생성).
      JOBCARD_ENV: "${JOBCARD_ENV:-dev}"
      # 토큰 서명 키. 예전에는 이 줄이 없어 컨테이너가 저장소에 적힌 개발용 기본 키로 서명했다
      # (누구나 사업주 토큰을 위조할 수 있었다). 생성: python -c "import secrets; print(secrets.token_urlsafe(48))"
      # 값은 Docker secret 파일(./secrets/jobcard_secret.txt → /run/secrets/jobcard_secret)에 둔다.
      JOBCARD_SECRET_FILE: "/run/secrets/jobcard_secret"
      # 하위호환: 위 파일이 비어 있을 때만 .env의 JOBCARD_SECRET를 쓴다(secret_env.py). 이 줄을 바로 없애지
      # 않는 이유: 키를 .env에만 둔 기존 설치본이 업그레이드하자마자 개발용 기본 키로 바뀌면 근로자 접속 코드
      # 해시가 모두 어긋난다. 파일로 옮기고 .env에서 지우면 빈 값이 된다. 다음 정리 때 이 줄을 없앤다.
      JOBCARD_SECRET: "${JOBCARD_SECRET:-}"
      DEMO_SEED: "${DEMO_SEED:-}"
      # 데모 사업장 코드(근로자 로그인 화면에서 처음 한 번 입력). 데모 계정이 처음 만들어질 때만 쓴다.
      DEMO_WORKPLACE_CODE: "${DEMO_WORKPLACE_CODE:-DEMO01}"
      # 리버스 프록시(HTTPS 종단) 뒤에 둘 때만 1. 로그인 시도 제한이 실제 접속자 IP를 보게 한다.
      TRUST_FORWARDED_FOR: "${TRUST_FORWARDED_FOR:-0}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}"
      # ports를 127.0.0.1로 고정했으니(위 ai_service 주석) localhost가 정상 동작한다.
      PUBLIC_BACKEND_URL: "${PUBLIC_BACKEND_URL:-http://localhost:8000}"
      # Google Cloud Text-to-Speech 기본 사용 설정
      # 서비스 계정 JSON은 Docker secret으로 이 파일 하나만 넘긴다. 예전에는 ./secrets 디렉터리 전체를
      # 바인드 마운트해 backend가 쓰지 않는 다른 비밀값 파일(OpenAI 키 등)까지 읽을 수 있었다.
      # 파일이 비어 있으면(키 없는 설치) tts.py가 ADC(Workload Identity 등)로 넘어간다.
      GOOGLE_APPLICATION_CREDENTIALS: "/run/secrets/google_tts_credentials"
      GOOGLE_TTS_LANGUAGE: "ko-KR"
      GOOGLE_TTS_VOICE: "ko-KR-Standard-A"
      GOOGLE_TTS_SPEAKING_RATE: "0.9"
      GOOGLE_TTS_PITCH: "0"
      TTS_CACHE_DIR: "/app/data/tts"
      PHOTO_DIR: "/app/data/photos"
      MAX_PHOTO_BYTES: "5242880"
      # 사진·TTS 서명 URL 수명(초). 정적 공개 경로 대신 이 URL로만 나간다(backend/media.py).
      MEDIA_URL_TTL_SECONDS: "${MEDIA_URL_TTL_SECONDS:-3600}"
      # 개인정보 처리방침 버전(동의 기록에 함께 남는다). 방침을 고치면 올린다.
      PRIVACY_POLICY_VERSION: "${PRIVACY_POLICY_VERSION:-2026-11-07-draft}"
      # scheduler가 남긴 마지막 purge 성공 기록(/health의 purge). scheduler와 같은 경로여야 한다.
      PURGE_STATUS_FILE: "/app/data/maintenance/purge_status.json"
      PURGE_INTERVAL_HOURS: "${PURGE_INTERVAL_HOURS:-24}"
    volumes:
      - ./data/aac:/app/aac:ro
      # SQLite는 macOS 바인드 마운트(VirtioFS)에서 'disk I/O error'를 내므로
      # DB/사진/TTS 데이터는 Docker named volume에 둔다(리눅스 VM 내부 I/O로 회피).
      - jobcard-data:/app/data
    # backend에 필요한 것만 연결한다(OpenAI 키는 ai_service만 쓴다).
    secrets:
      - jobcard_secret
      - google_tts_credentials
    depends_on:
      ai_service:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: "${VITE_API_BASE:-http://localhost:8000}"
    container_name: jobcard-web
    ports:
      - "127.0.0.1:5173:80"  # 위 ai_service 주석 참고
    depends_on:
      backend:
        condition: service_healthy

volumes:
  jobcard-data:

# 비밀값은 환경변수가 아니라 파일로 넘긴다(컨테이너 안 /run/secrets/<이름>, 읽기 전용).
# 원본 파일이 없으면 compose가 기동을 거부하므로 처음 한 번 scripts/init-secrets.sh(Windows: .ps1)로
# 빈 파일을 만든다 — 빈 파일이면 앱은 예전 동작(환경변수/기본값/규칙 기반 폴백)을 그대로 한다.
# 파일은 .gitignore 대상이다. 절차·교체 방법은 docs/security/secrets.md.
secrets:
  openai_api_key:
    file: ./secrets/openai_api_key.txt
  jobcard_secret:
    file: ./secrets/jobcard_secret.txt
  google_tts_credentials:
    file: ./secrets/google-tts.json
